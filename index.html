<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Marks Calculator</h1>
    <form action="/result" method="POST">
        <label>Student Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Roll_no:</label>
        <input type="number" name="roll_no" required>
        <br><br>

        <label>Full stack Development:</label>
        <input type="number" name="fsd" required>
        <br><br>

        <label>Web Development:</label>
        <input type="number" name="wd" required>
        <br><br>


        <label>.NET:</label>
        <input type="number" name="net" required>
        <br><br>

        <label>Cloud:</label>
        <input type="number" name="cloud" required>
        <br><br>
 
        <button type="submit">Calculate Result</button>

</body>
</html>
